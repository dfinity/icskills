name: Upstream sync check

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  check-motoko:
    name: Check caffeinelabs/motoko
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Get latest motoko release tag
        id: latest
        run: |
          TAG=$(gh release view --repo caffeinelabs/motoko --json tagName -q .tagName)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get current pinned tag and commit SHA
        id: current
        run: |
          TAG=$(awk '/^## motoko$/{f=1; next} /^## /{f=0} f && /\*\*Tag:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Tag:\*\* //')
          SHA=$(awk '/^## motoko$/{f=1; next} /^## /{f=0} f && /\*\*Commit:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Commit:\*\* //')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Skip if already at latest
        id: skip
        run: |
          if [ "${{ steps.latest.outputs.tag }}" = "${{ steps.current.outputs.tag }}" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest: ${{ steps.current.outputs.tag }}"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve commit SHA for new release
        if: steps.skip.outputs.needed == 'true'
        id: sha
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          RESULT=$(curl -sf "https://api.github.com/repos/caffeinelabs/motoko/git/ref/tags/${TAG}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['object']['sha'], d['object']['type'])")
          OBJ_SHA=$(echo "$RESULT" | awk '{print $1}')
          OBJ_TYPE=$(echo "$RESULT" | awk '{print $2}')
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT=$(curl -sf "https://api.github.com/repos/caffeinelabs/motoko/git/tags/${OBJ_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          else
            COMMIT="$OBJ_SHA"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Compute upstream diff and build issue body
        if: steps.skip.outputs.needed == 'true'
        id: diff
        run: |
          OLD_SHA="${{ steps.current.outputs.sha }}"
          NEW_SHA="${{ steps.sha.outputs.commit }}"
          CURRENT="${{ steps.current.outputs.tag }}"
          LATEST="${{ steps.latest.outputs.tag }}"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "New tag $LATEST resolves to the same commit as $CURRENT — no content changes"
            exit 0
          fi

          declare -A UPSTREAM_TO_LOCAL=(
            ["writing-motoko"]="motoko"
            ["migrating-motoko"]="migrating-motoko"
            ["migrating-motoko-enhanced"]="migrating-motoko-enhanced"
          )

          {
            echo "## Upstream diff: caffeinelabs/motoko \`${CURRENT}\` → \`${LATEST}\`"
            echo ""
            echo "Commit: [\`${NEW_SHA:0:12}\`](https://github.com/caffeinelabs/motoko/commit/${NEW_SHA})"
            echo ""
            echo "To sync: create branch \`chore/sync-upstream-motoko-${LATEST}\`, follow the"
            echo "[Upstream Sync Strategy](https://github.com/dfinity/icskills/blob/main/.claude/CLAUDE.md#upstream-sync-strategy)"
            echo "in CLAUDE.md, run \`npm run validate\`, and open a PR that closes this issue."
            echo ""
            echo "> **Note:** this diff was computed at issue-open time. Re-run before applying —"
            echo "> changes may have landed on main since."
            echo ""
            echo "**Before applying:** check \`.claude/upstream.md\` for icskills-owned sections."
            echo "Do NOT overwrite those sections from upstream. Also check whether any owned"
            echo "section is now covered by the upstream changes — if so, drop the icskills copy"
            echo "and remove it from the owned list to avoid duplicating content."
            echo ""
          } > /tmp/issue-body.md

          HAS_CHANGES=false

          for upstream_name in "writing-motoko" "migrating-motoko" "migrating-motoko-enhanced"; do
            local_name="${UPSTREAM_TO_LOCAL[$upstream_name]}"

            OLD_FILES=$(curl -sf \
              "https://api.github.com/repos/caffeinelabs/motoko/contents/.agents/skills/${upstream_name}?ref=${OLD_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin) if f['type'] == 'file']" \
              2>/dev/null || echo "")

            NEW_FILES=$(curl -sf \
              "https://api.github.com/repos/caffeinelabs/motoko/contents/.agents/skills/${upstream_name}?ref=${NEW_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin) if f['type'] == 'file']" \
              2>/dev/null || echo "")

            ALL_FILES=$(printf '%s\n%s\n' "$OLD_FILES" "$NEW_FILES" | sort -u | grep -v '^$')

            SKILL_HAS_CHANGES=false
            > /tmp/skill-diff-body.md

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              curl -sf "https://raw.githubusercontent.com/caffeinelabs/motoko/${OLD_SHA}/.agents/skills/${upstream_name}/${file}" \
                > /tmp/upstream-old-file 2>/dev/null || > /tmp/upstream-old-file

              curl -sf "https://raw.githubusercontent.com/caffeinelabs/motoko/${NEW_SHA}/.agents/skills/${upstream_name}/${file}" \
                > /tmp/upstream-new-file 2>/dev/null || > /tmp/upstream-new-file

              DIFF=$(diff /tmp/upstream-old-file /tmp/upstream-new-file || true)
              if [ -n "$DIFF" ]; then
                SKILL_HAS_CHANGES=true
                HAS_CHANGES=true
                {
                  echo "#### \`${file}\`"
                  echo ""
                  echo '<details><summary>Show diff (- old upstream, + new upstream)</summary>'
                  echo ""
                  echo '```diff'
                  echo "$DIFF"
                  echo '```'
                  echo ""
                  echo '</details>'
                  echo ""
                } >> /tmp/skill-diff-body.md
              fi
            done <<< "$ALL_FILES"

            if [ "$SKILL_HAS_CHANGES" = "true" ]; then
              {
                echo "### \`${local_name}\` ← upstream \`${upstream_name}\`"
                echo ""
                cat /tmp/skill-diff-body.md
              } >> /tmp/issue-body.md
            else
              {
                echo "### \`${local_name}\` — no changes"
                echo ""
              } >> /tmp/issue-body.md
            fi
          done

          if [ "$HAS_CHANGES" = "false" ]; then
            echo "No skill content changes detected between $CURRENT and $LATEST — skipping issue"
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Manage and open sync issue
        if: steps.skip.outputs.needed == 'true' && steps.diff.outputs.has_changes == 'true'
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          CURRENT="${{ steps.current.outputs.tag }}"

          gh label create "upstream-motoko" --color "BFD4F2" \
            --description "Upstream sync: caffeinelabs/motoko" 2>/dev/null || true

          OPEN_ISSUE=$(gh issue list \
            --label "upstream-motoko" \
            --state open \
            --limit 1 \
            --json number,title \
            --jq 'first // empty')

          if [ -n "$OPEN_ISSUE" ]; then
            ISSUE_NUM=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
            ISSUE_TITLE=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])")

            if echo "$ISSUE_TITLE" | grep -qF "$LATEST"; then
              echo "Issue #$ISSUE_NUM already open for $LATEST — skipping"
              exit 0
            fi

            gh issue close "$ISSUE_NUM" \
              --comment "Superseded: a newer release (\`$LATEST\`) is now available. Closing — a fresh issue will be opened. When syncing, target \`$LATEST\` directly; you do not need to sync through the intermediate release this issue tracked."
            echo "Closed stale issue #$ISSUE_NUM"
          fi

          gh issue create \
            --title "chore: upstream sync available — caffeinelabs/motoko ${CURRENT} → ${LATEST}" \
            --body-file /tmp/issue-body.md \
            --label "upstream-motoko"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  check-mops:
    name: Check caffeinelabs/mops
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Get latest mops release tag
        id: latest
        run: |
          TAG=$(gh release list --repo caffeinelabs/mops --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("cli-"))] | first | .tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get current pinned tag and commit SHA
        id: current
        run: |
          TAG=$(awk '/^## mops-cli$/{f=1; next} /^## /{f=0} f && /\*\*Tag:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Tag:\*\* //')
          SHA=$(awk '/^## mops-cli$/{f=1; next} /^## /{f=0} f && /\*\*Commit:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Commit:\*\* //')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Skip if already at latest
        id: skip
        run: |
          if [ "${{ steps.latest.outputs.tag }}" = "${{ steps.current.outputs.tag }}" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest: ${{ steps.current.outputs.tag }}"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve commit SHA for new release
        if: steps.skip.outputs.needed == 'true'
        id: sha
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          RESULT=$(curl -sf "https://api.github.com/repos/caffeinelabs/mops/git/ref/tags/${TAG}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['object']['sha'], d['object']['type'])")
          OBJ_SHA=$(echo "$RESULT" | awk '{print $1}')
          OBJ_TYPE=$(echo "$RESULT" | awk '{print $2}')
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT=$(curl -sf "https://api.github.com/repos/caffeinelabs/mops/git/tags/${OBJ_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          else
            COMMIT="$OBJ_SHA"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Compute upstream diff and build issue body
        if: steps.skip.outputs.needed == 'true'
        id: diff
        run: |
          OLD_SHA="${{ steps.current.outputs.sha }}"
          NEW_SHA="${{ steps.sha.outputs.commit }}"
          CURRENT="${{ steps.current.outputs.tag }}"
          LATEST="${{ steps.latest.outputs.tag }}"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "New tag $LATEST resolves to the same commit as $CURRENT — no content changes"
            exit 0
          fi

          OLD_FILES=$(curl -sf \
            "https://api.github.com/repos/caffeinelabs/mops/contents/.agents/skills/mops-cli?ref=${OLD_SHA}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin) if f['type'] == 'file']" \
            2>/dev/null || echo "")

          NEW_FILES=$(curl -sf \
            "https://api.github.com/repos/caffeinelabs/mops/contents/.agents/skills/mops-cli?ref=${NEW_SHA}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin) if f['type'] == 'file']" \
            2>/dev/null || echo "")

          ALL_FILES=$(printf '%s\n%s\n' "$OLD_FILES" "$NEW_FILES" | sort -u | grep -v '^$')

          {
            echo "## Upstream diff: caffeinelabs/mops \`${CURRENT}\` → \`${LATEST}\`"
            echo ""
            echo "Commit: [\`${NEW_SHA:0:12}\`](https://github.com/caffeinelabs/mops/commit/${NEW_SHA})"
            echo ""
            echo "To sync: create branch \`chore/sync-upstream-mops-cli-${LATEST}\`, follow the"
            echo "[Upstream Sync Strategy](https://github.com/dfinity/icskills/blob/main/.claude/CLAUDE.md#upstream-sync-strategy)"
            echo "in CLAUDE.md, run \`npm run validate\`, and open a PR that closes this issue."
            echo ""
            echo "> **Note:** this diff was computed at issue-open time. Re-run before applying —"
            echo "> changes may have landed on main since."
            echo ""
            echo "**Before applying:** check \`.claude/upstream.md\` for icskills-owned sections."
            echo "Do NOT overwrite those sections from upstream. Also check whether any owned"
            echo "section is now covered by the upstream changes — if so, drop the icskills copy"
            echo "and remove it from the owned list to avoid duplicating content."
            echo ""
            echo "### \`mops-cli\`"
            echo ""
          } > /tmp/issue-body.md

          HAS_CHANGES=false
          > /tmp/skill-diff-body.md

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            curl -sf "https://raw.githubusercontent.com/caffeinelabs/mops/${OLD_SHA}/.agents/skills/mops-cli/${file}" \
              > /tmp/upstream-old-file 2>/dev/null || > /tmp/upstream-old-file

            curl -sf "https://raw.githubusercontent.com/caffeinelabs/mops/${NEW_SHA}/.agents/skills/mops-cli/${file}" \
              > /tmp/upstream-new-file 2>/dev/null || > /tmp/upstream-new-file

            DIFF=$(diff /tmp/upstream-old-file /tmp/upstream-new-file || true)
            if [ -n "$DIFF" ]; then
              HAS_CHANGES=true
              {
                echo "#### \`${file}\`"
                echo ""
                echo '<details><summary>Show diff (- old upstream, + new upstream)</summary>'
                echo ""
                echo '```diff'
                echo "$DIFF"
                echo '```'
                echo ""
                echo '</details>'
                echo ""
              } >> /tmp/skill-diff-body.md
            fi
          done <<< "$ALL_FILES"

          if [ "$HAS_CHANGES" = "true" ]; then
            cat /tmp/skill-diff-body.md >> /tmp/issue-body.md
          else
            echo "No changes." >> /tmp/issue-body.md
            echo "No skill content changes detected between $CURRENT and $LATEST — skipping issue"
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Manage and open sync issue
        if: steps.skip.outputs.needed == 'true' && steps.diff.outputs.has_changes == 'true'
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          CURRENT="${{ steps.current.outputs.tag }}"

          gh label create "upstream-mops" --color "BFD4F2" \
            --description "Upstream sync: caffeinelabs/mops" 2>/dev/null || true

          OPEN_ISSUE=$(gh issue list \
            --label "upstream-mops" \
            --state open \
            --limit 1 \
            --json number,title \
            --jq 'first // empty')

          if [ -n "$OPEN_ISSUE" ]; then
            ISSUE_NUM=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
            ISSUE_TITLE=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])")

            if echo "$ISSUE_TITLE" | grep -qF "$LATEST"; then
              echo "Issue #$ISSUE_NUM already open for $LATEST — skipping"
              exit 0
            fi

            gh issue close "$ISSUE_NUM" \
              --comment "Superseded: a newer release (\`$LATEST\`) is now available. Closing — a fresh issue will be opened. When syncing, target \`$LATEST\` directly; you do not need to sync through the intermediate release this issue tracked."
            echo "Closed stale issue #$ISSUE_NUM"
          fi

          gh issue create \
            --title "chore: upstream sync available — caffeinelabs/mops ${CURRENT} → ${LATEST}" \
            --body-file /tmp/issue-body.md \
            --label "upstream-mops"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
