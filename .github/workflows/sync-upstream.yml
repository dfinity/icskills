name: Upstream sync check

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday
  workflow_dispatch:

jobs:
  check-motoko:
    name: Check caffeinelabs/motoko
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Get latest motoko release tag
        id: latest
        run: |
          TAG=$(gh release view --repo caffeinelabs/motoko --json tagName -q .tagName)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get current pinned tag
        id: current
        run: |
          TAG=$(awk '/^## motoko$/{f=1; next} /^## /{f=0} f && /\*\*Tag:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Tag:\*\* //')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check and manage sync issue
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          CURRENT="${{ steps.current.outputs.tag }}"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest: $CURRENT"
            exit 0
          fi

          # Ensure label exists (idempotent — safe to run even if label already exists)
          gh label create "upstream-motoko" --color "BFD4F2" \
            --description "Upstream sync: caffeinelabs/motoko" 2>/dev/null || true

          # Look for an existing open sync issue for this upstream (per-repo label, no title parsing)
          OPEN_ISSUE=$(gh issue list \
            --label "upstream-motoko" \
            --state open \
            --limit 1 \
            --json number,title \
            --jq 'first // empty')

          if [ -n "$OPEN_ISSUE" ]; then
            ISSUE_NUM=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
            ISSUE_TITLE=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])")

            if echo "$ISSUE_TITLE" | grep -qF "$LATEST"; then
              echo "needed=false" >> $GITHUB_OUTPUT
              echo "Issue #$ISSUE_NUM already open for $LATEST — skipping"
              exit 0
            fi

            # A newer release is out — close the stale issue before opening a fresh one
            gh issue close "$ISSUE_NUM" \
              --comment "Superseded: a newer release (\`$LATEST\`) is now available. Closing — a fresh issue will be opened. When syncing, target \`$LATEST\` directly; you do not need to sync through the intermediate release this issue tracked."
            echo "Closed stale issue #$ISSUE_NUM"
          fi

          echo "needed=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Resolve commit SHA for new release
        if: steps.check.outputs.needed == 'true'
        id: sha
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          RESULT=$(curl -sf "https://api.github.com/repos/caffeinelabs/motoko/git/ref/tags/${TAG}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['object']['sha'], d['object']['type'])")
          OBJ_SHA=$(echo "$RESULT" | awk '{print $1}')
          OBJ_TYPE=$(echo "$RESULT" | awk '{print $2}')
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT=$(curl -sf "https://api.github.com/repos/caffeinelabs/motoko/git/tags/${OBJ_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          else
            COMMIT="$OBJ_SHA"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Fetch upstream files and build issue body
        if: steps.check.outputs.needed == 'true'
        run: |
          SHA="${{ steps.sha.outputs.commit }}"
          CURRENT="${{ steps.current.outputs.tag }}"
          LATEST="${{ steps.latest.outputs.tag }}"

          declare -A UPSTREAM_TO_LOCAL=(
            ["writing-motoko"]="motoko"
            ["migrating-motoko"]="migrating-motoko"
            ["migrating-motoko-enhanced"]="migrating-motoko-enhanced"
          )

          {
            echo "## Upstream diff: caffeinelabs/motoko \`${CURRENT}\` → \`${LATEST}\`"
            echo ""
            echo "Commit: [\`${SHA:0:12}\`](https://github.com/caffeinelabs/motoko/commit/${SHA})"
            echo ""
            echo "To sync: create a branch \`chore/sync-upstream-motoko-${LATEST}\`, follow the"
            echo "[Upstream Sync Strategy](https://github.com/dfinity/icskills/blob/main/.claude/CLAUDE.md#upstream-sync-strategy)"
            echo "in CLAUDE.md, run \`npm run validate\`, and open a PR that closes this issue."
            echo ""
            echo "> **Note:** this diff was computed when the issue was opened. Re-run the diff commands"
            echo "> from CLAUDE.md against the current SKILL.md files before applying — changes may have"
            echo "> landed on main since this issue was opened."
            echo ""
            echo "**Before applying:** check which sections are listed as \`owned by icskills\`"
            echo "in each skill's upstream comment block. Do NOT overwrite those sections."
            echo ""
          } > /tmp/issue-body.md

          for upstream_name in "writing-motoko" "migrating-motoko" "migrating-motoko-enhanced"; do
            local_name="${UPSTREAM_TO_LOCAL[$upstream_name]}"
            curl -sf "https://raw.githubusercontent.com/caffeinelabs/motoko/${SHA}/.agents/skills/${upstream_name}/SKILL.md" \
              > /tmp/upstream-${upstream_name}.md 2>/dev/null || {
              echo "(skill not found at this path)" > /tmp/upstream-${upstream_name}.md
            }
            DIFF=$(diff skills/${local_name}/SKILL.md /tmp/upstream-${upstream_name}.md || true)
            if [ -n "$DIFF" ]; then
              {
                echo "### \`${local_name}\` ← upstream \`${upstream_name}\`"
                echo ""
                echo '<details><summary>Show diff (- ours, + upstream)</summary>'
                echo ""
                echo '```diff'
                echo "$DIFF"
                echo '```'
                echo ""
                echo '</details>'
                echo ""
              } >> /tmp/issue-body.md
            else
              echo "### \`${local_name}\` — no changes" >> /tmp/issue-body.md
              echo "" >> /tmp/issue-body.md
            fi

            # Diff reference files: every .md in our references/ against upstream's skill dir.
            # Also report any upstream .md files we don't have locally (new reference added upstream).
            if [ -d "skills/${local_name}/references" ]; then
              # Fetch upstream's directory listing via GitHub API to detect all .md files
              UPSTREAM_REF_FILES=$(curl -sf \
                "https://api.github.com/repos/caffeinelabs/motoko/contents/.agents/skills/${upstream_name}?ref=${SHA}" \
                -H "Authorization: Bearer $GH_TOKEN" | \
                python3 -c "import sys,json; [print(f['name']) for f in json.load(sys.stdin) if f['name'].endswith('.md') and f['name'] != 'SKILL.md']" 2>/dev/null || true)

              for ref_file in $UPSTREAM_REF_FILES; do
                curl -sf "https://raw.githubusercontent.com/caffeinelabs/motoko/${SHA}/.agents/skills/${upstream_name}/${ref_file}" \
                  > /tmp/upstream-${upstream_name}-${ref_file} 2>/dev/null || continue
                local_ref="skills/${local_name}/references/${ref_file}"
                if [ -f "$local_ref" ]; then
                  REF_DIFF=$(diff "$local_ref" /tmp/upstream-${upstream_name}-${ref_file} || true)
                  if [ -n "$REF_DIFF" ]; then
                    {
                      echo "### \`${local_name}/references/${ref_file}\` ← upstream \`${upstream_name}/${ref_file}\`"
                      echo ""
                      echo '<details><summary>Show diff (- ours, + upstream)</summary>'
                      echo ""
                      echo '```diff'
                      echo "$REF_DIFF"
                      echo '```'
                      echo ""
                      echo '</details>'
                      echo ""
                    } >> /tmp/issue-body.md
                  else
                    echo "### \`${local_name}/references/${ref_file}\` — no changes" >> /tmp/issue-body.md
                    echo "" >> /tmp/issue-body.md
                  fi
                else
                  # Upstream has a reference file we don't — surface it as new
                  {
                    echo "### \`${local_name}/references/${ref_file}\` — **NEW upstream file** (not present locally)"
                    echo ""
                    echo '<details><summary>Show upstream content</summary>'
                    echo ""
                    echo '```markdown'
                    cat /tmp/upstream-${upstream_name}-${ref_file}
                    echo '```'
                    echo ""
                    echo '</details>'
                    echo ""
                  } >> /tmp/issue-body.md
                fi
              done
            fi
          done

      - name: Open sync issue
        if: steps.check.outputs.needed == 'true'
        run: |
          gh issue create \
            --title "chore: upstream sync available — caffeinelabs/motoko ${{ steps.current.outputs.tag }} → ${{ steps.latest.outputs.tag }}" \
            --body-file /tmp/issue-body.md \
            --label "upstream-motoko"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  check-mops:
    name: Check caffeinelabs/mops
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Get latest mops release tag
        id: latest
        run: |
          TAG=$(gh release list --repo caffeinelabs/mops --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("cli-"))] | first | .tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get current pinned tag
        id: current
        run: |
          TAG=$(awk '/^## mops-cli$/{f=1; next} /^## /{f=0} f && /\*\*Tag:\*\*/{print; exit}' .claude/upstream.md | sed 's/.*\*\*Tag:\*\* //')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check and manage sync issue
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.tag }}"
          CURRENT="${{ steps.current.outputs.tag }}"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest: $CURRENT"
            exit 0
          fi

          # Ensure label exists (idempotent — safe to run even if label already exists)
          gh label create "upstream-mops" --color "BFD4F2" \
            --description "Upstream sync: caffeinelabs/mops" 2>/dev/null || true

          # Look for an existing open sync issue for this upstream (per-repo label, no title parsing)
          OPEN_ISSUE=$(gh issue list \
            --label "upstream-mops" \
            --state open \
            --limit 1 \
            --json number,title \
            --jq 'first // empty')

          if [ -n "$OPEN_ISSUE" ]; then
            ISSUE_NUM=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
            ISSUE_TITLE=$(echo "$OPEN_ISSUE" | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])")

            if echo "$ISSUE_TITLE" | grep -qF "$LATEST"; then
              echo "needed=false" >> $GITHUB_OUTPUT
              echo "Issue #$ISSUE_NUM already open for $LATEST — skipping"
              exit 0
            fi

            # A newer release is out — close the stale issue before opening a fresh one
            gh issue close "$ISSUE_NUM" \
              --comment "Superseded: a newer release (\`$LATEST\`) is now available. Closing — a fresh issue will be opened. When syncing, target \`$LATEST\` directly; you do not need to sync through the intermediate release this issue tracked."
            echo "Closed stale issue #$ISSUE_NUM"
          fi

          echo "needed=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Resolve commit SHA for new release
        if: steps.check.outputs.needed == 'true'
        id: sha
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          RESULT=$(curl -sf "https://api.github.com/repos/caffeinelabs/mops/git/ref/tags/${TAG}" \
            -H "Authorization: Bearer $GH_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['object']['sha'], d['object']['type'])")
          OBJ_SHA=$(echo "$RESULT" | awk '{print $1}')
          OBJ_TYPE=$(echo "$RESULT" | awk '{print $2}')
          if [ "$OBJ_TYPE" = "tag" ]; then
            COMMIT=$(curl -sf "https://api.github.com/repos/caffeinelabs/mops/git/tags/${OBJ_SHA}" \
              -H "Authorization: Bearer $GH_TOKEN" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          else
            COMMIT="$OBJ_SHA"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Fetch upstream file and build issue body
        if: steps.check.outputs.needed == 'true'
        run: |
          SHA="${{ steps.sha.outputs.commit }}"
          CURRENT="${{ steps.current.outputs.tag }}"
          LATEST="${{ steps.latest.outputs.tag }}"

          curl -sf "https://raw.githubusercontent.com/caffeinelabs/mops/${SHA}/.agents/skills/mops-cli/SKILL.md" \
            > /tmp/upstream-mops-cli.md 2>/dev/null || {
            echo "(skill not found at this path)" > /tmp/upstream-mops-cli.md
          }

          DIFF=$(diff skills/mops-cli/SKILL.md /tmp/upstream-mops-cli.md || true)

          {
            echo "## Upstream diff: caffeinelabs/mops \`${CURRENT}\` → \`${LATEST}\`"
            echo ""
            echo "Commit: [\`${SHA:0:12}\`](https://github.com/caffeinelabs/mops/commit/${SHA})"
            echo ""
            echo "To sync: create a branch \`chore/sync-upstream-mops-${LATEST}\`, follow the"
            echo "[Upstream Sync Strategy](https://github.com/dfinity/icskills/blob/main/.claude/CLAUDE.md#upstream-sync-strategy)"
            echo "in CLAUDE.md, run \`npm run validate\`, and open a PR that closes this issue."
            echo ""
            echo "> **Note:** this diff was computed when the issue was opened. Re-run the diff commands"
            echo "> from CLAUDE.md against the current SKILL.md files before applying — changes may have"
            echo "> landed on main since this issue was opened."
            echo ""
            echo "**Before applying:** check which sections are listed as \`owned by icskills\`"
            echo "in the skill's upstream comment block. Do NOT overwrite those sections."
            echo ""
            echo "### \`mops-cli\`"
            echo ""
            if [ -n "$DIFF" ]; then
              echo '<details><summary>Show diff (- ours, + upstream)</summary>'
              echo ""
              echo '```diff'
              echo "$DIFF"
              echo '```'
              echo ""
              echo '</details>'
            else
              echo "No changes."
            fi
          } > /tmp/issue-body.md

      - name: Open sync issue
        if: steps.check.outputs.needed == 'true'
        run: |
          gh issue create \
            --title "chore: upstream sync available — caffeinelabs/mops ${{ steps.current.outputs.tag }} → ${{ steps.latest.outputs.tag }}" \
            --body-file /tmp/issue-body.md \
            --label "upstream-mops"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
