name: Checks

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install skill-validator
        env:
          SKILL_VALIDATOR_VERSION: "1.4.0"
        run: |
          curl -sL "https://github.com/agent-ecosystem/skill-validator/releases/download/v${SKILL_VALIDATOR_VERSION}/skill-validator_${SKILL_VALIDATOR_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin skill-validator

      - run: npm ci

      - name: Run skill-validator checks
        id: skill-validator
        run: |
          set +e
          report=$(skill-validator check skills/ -o markdown 2>/dev/null)
          exit_code=$?
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          delimiter=$(openssl rand -hex 8)
          {
            echo "report<<${delimiter}"
            echo "$report"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          # Re-run with annotations sent to stdout/stderr for GitHub to process
          skill-validator check skills/ --emit-annotations > /dev/null
          exit 0

      - name: Run project-specific checks
        id: check-project
        run: |
          set +e
          output=$(node scripts/check-project.js 2>&1)
          exit_code=$?
          echo "$output"
          delimiter=$(openssl rand -hex 8)
          {
            echo "report<<${delimiter}"
            echo "$output"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: skill-validator
          message: |
            ## Skill Validation Report

            ${{ steps.skill-validator.outputs.report }}

            ### Project Checks

            ```
            ${{ steps.check-project.outputs.report }}
            ```

      - name: Fail on validation errors
        if: steps.skill-validator.outputs.exit_code == '1' || steps.check-project.outputs.exit_code == '1'
        run: |
          echo "::error::Validation found errors"
          exit 1
