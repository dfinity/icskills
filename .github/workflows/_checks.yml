name: Checks

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Use the exact npm pinned in package.json's packageManager field, so the
      # lockfile CI validates with `npm ci` is byte-identical to what
      # contributors produce locally. Without this, CI uses Node's bundled npm,
      # whose version drifts per Node patch and can disagree with local npm on
      # optional-peer pruning — breaking `npm ci`.
      - run: corepack enable

      - name: Install skill-validator
        env:
          SKILL_VALIDATOR_VERSION: "1.5.1"
        run: |
          curl -sL "https://github.com/agent-ecosystem/skill-validator/releases/download/v${SKILL_VALIDATOR_VERSION}/skill-validator_${SKILL_VALIDATOR_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin skill-validator

      - name: Detect changed skills
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'skills/' \
              | grep -oP '^skills/\K[^/]+(?=/)' \
              | sort -u \
              | grep -v '^_' \
              | while read -r d; do [ -f "skills/$d/SKILL.md" ] && echo "$d" || true; done)
            if [ -n "$dirs" ]; then
              # Build space-separated paths for skill-validator
              paths=$(echo "$dirs" | sed 's|^|skills/|' | tr '\n' ' ')
              echo "paths=$paths" >> "$GITHUB_OUTPUT"
              echo "names=$(echo "$dirs" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "paths=skills/" >> "$GITHUB_OUTPUT"
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # Build gate: runs on every PR (including dependency bumps that touch no
      # skills) so a broken Astro build can never pass CI. skill-validator only
      # runs when skills change, so without this a dep upgrade could go green
      # here yet fail the real build in deploy-ic.yml after merge.
      - name: Build site
        run: npm run build

      - name: Run skill-validator checks
        id: skill-validator
        if: steps.changed.outputs.found == 'true'
        run: |
          set +e
          # TODO: re-enable link checks once https://github.com/agent-ecosystem/skill-validator/issues/45 is resolved
          report=$(skill-validator check ${{ steps.changed.outputs.paths }} --skip links -o markdown 2>/dev/null)
          exit_code=$?
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          delimiter=$(openssl rand -hex 8)
          {
            echo "report<<${delimiter}"
            echo "$report"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          # Re-run with annotations sent to stdout/stderr for GitHub to process
          skill-validator check ${{ steps.changed.outputs.paths }} --skip links --emit-annotations > /dev/null
          exit 0

      - name: Run project-specific checks
        id: check-project
        if: steps.changed.outputs.found == 'true'
        run: |
          set +e
          output=$(node scripts/check-project.js ${{ steps.changed.outputs.names }} 2>&1)
          exit_code=$?
          echo "$output"
          delimiter=$(openssl rand -hex 8)
          {
            echo "report<<${delimiter}"
            echo "$output"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.changed.outputs.found == 'true' && always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: skill-validator
          message: |
            ## Skill Validation Report

            ${{ steps.skill-validator.outputs.report }}

            ### Project Checks

            ```
            ${{ steps.check-project.outputs.report }}
            ```

      - name: Post PR comment (no skills changed)
        if: github.event_name == 'pull_request' && steps.changed.outputs.found == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: skill-validator
          recreate: true
          message: |
            ## Skill Validation Report

            No skill files were changed in this PR — validation skipped.

      - name: Fail on validation errors
        if: steps.changed.outputs.found == 'true' && (steps.skill-validator.outputs.exit_code == '1' || steps.check-project.outputs.exit_code == '1')
        run: |
          echo "::error::Validation found errors"
          exit 1
